services:

  backend:
    build:
      context: ./backend
    container_name: backend-service
    restart: unless-stopped
    depends_on:
      - rabbitmq
    ports:
      - "8080:8000"
    environment:
      DATABASE_BACKEND: ${DATABASE_BACKEND}
      RABBIT_URL: ${RABBIT_URL}

  tg-service:
    build:
      context: ./tg_service
    container_name: tg-service
    restart: unless-stopped
    depends_on:
      - rabbitmq
    environment:
      TOKEN: ${TOKEN}
      DATABASE: ${DATABASE}
      RABBIT_URL: ${RABBIT_URL}

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "25673:5672"
      - "25672:15672"

  frontend:
    build:
      context: ./frontend
    container_name: frontend-service
    restart: unless-stopped
    ports:
      - "5173:5173"